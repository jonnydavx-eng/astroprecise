<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Deep-Time Corridor — drag tonight's sky back to the Big Bang | Astro Precise</title>
<meta name="description" content="A time instrument built on the real engine: drag from tonight's computed sky back through the accuracy wall — where the numbers honestly fan into uncertainty — to the first light of the universe.">
<link rel="canonical" href="https://astroprecise.app/deep-time.html">
<meta property="og:title" content="The Deep-Time Corridor — from tonight's real sky to the Big Bang">
<meta property="og:description" content="Drag time back through the real computed sky, past the honest uncertainty wall, to the oldest light there is.">
<meta property="og:url" content="https://astroprecise.app/deep-time.html">
<meta property="og:image" content="https://astroprecise.app/img/eclipse-og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:ital,wght@0,400;0,500;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="./js/orrery.js?v=773"></script>
<style>
:root{--ink:#e9edf2;--dim:rgba(233,237,242,.72);--faint:rgba(233,237,242,.5);--line:rgba(159,220,236,.18);--line2:rgba(159,220,236,.24);--acc:#9fdcec;--good:rgba(126,240,200,.85);--warn:#e6a15c}
*{box-sizing:border-box}
body{margin:0;background:#000;color:var(--ink);font-family:'Schibsted Grotesk',sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:var(--acc);text-decoration:none}a:hover{color:#fff}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.mono{font-family:'IBM Plex Mono',monospace}
#stage{position:relative;height:100vh;min-height:620px}
void-orrery{position:absolute;inset:0;transition:opacity 1.2s}
#deepLayer{position:absolute;inset:0;opacity:0;transition:opacity 1.2s;pointer-events:none}
#deepLayer canvas{width:100%;height:100%;display:block}
#fan{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .8s}
.hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column}
.hud .top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;padding:22px 26px;pointer-events:auto}
.receipt{border:1px solid var(--line);border-radius:10px;background:rgba(0,4,8,.55);backdrop-filter:blur(6px);padding:14px 18px;display:flex;flex-direction:column;gap:6px}
.receipt div{font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.06em;line-height:1.7;color:rgba(233,237,242,.85)}
.zone{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.26em;padding:5px 12px;border-radius:100px;border:1px solid var(--line2)}
.corridor{display:flex;flex-direction:column;gap:10px;padding:0 26px 24px;pointer-events:auto}
input.tl{-webkit-appearance:none;appearance:none;background:transparent;height:18px;cursor:pointer;border:0;padding:0;width:100%}
input.tl::-webkit-slider-runnable-track{height:3px;background:linear-gradient(90deg,rgba(126,240,200,.7) 0%,rgba(159,220,236,.6) 26%,rgba(230,161,92,.55) 42%,rgba(233,237,242,.25) 70%,rgba(233,237,242,.12) 100%)}
input.tl::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:#fff;box-shadow:0 0 16px var(--acc);margin-top:-5px}
input.tl::-moz-range-track{height:3px;background:rgba(159,220,236,.4)}
input.tl::-moz-range-thumb{width:13px;height:13px;border:0;border-radius:50%;background:#fff;box-shadow:0 0 16px var(--acc)}
.marks{display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:8px;letter-spacing:.14em;color:var(--faint)}
.btn{display:inline-block;background:var(--ink);color:#000;border:0;border-radius:100px;padding:11px 22px;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.2em;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:none;border:1px solid rgba(233,237,242,.35);color:var(--ink)}
@media (max-width:640px){#readout{max-width:calc(100vw - 52px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="stage">
  <void-orrery id="orr" start-focus="earth" start-radius="120"></void-orrery>
  <div id="deepLayer"><canvas id="deepCv"></canvas></div>
  <svg id="fan" viewBox="0 0 100 100" preserveAspectRatio="none">
    <path id="fanPath" d="" fill="rgba(230,161,92,.14)" stroke="rgba(230,161,92,.5)" stroke-width="0.2"></path>
  </svg>
  <div class="hud">
    <div class="top">
      <a class="mono" style="font-size:10px;letter-spacing:.22em;color:rgba(233,237,242,.75)" href="./index.html">← THE OBSERVATORY</a>
      <span class="mono" style="font-size:10px;letter-spacing:.26em;color:var(--acc)">THE DEEP-TIME CORRIDOR</span>
      <span class="zone" id="zoneBadge">COMPUTED</span>
    </div>
    <div style="flex:1"></div>
    <div style="padding:0 26px 14px;pointer-events:auto;max-width:520px" id="readout">
      <div class="receipt">
        <div id="r1">TONIGHT · THE REAL SKY</div>
        <div id="r2" style="color:var(--faint)"></div>
        <div id="r3" style="color:rgba(159,220,236,.85)"></div>
      </div>
    </div>
    <div class="corridor">
      <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
        <button class="btn" id="playBtn" type="button">▶ PLAY — 13.8 BILLION YEARS</button>
        <button class="btn ghost" id="nowBtn" type="button">TONIGHT</button>
        <span class="mono" style="font-size:8.5px;letter-spacing:.16em;color:var(--faint)">DRAG THE CORRIDOR · THE ENGINE COMPUTES AS FAR AS IT HONESTLY CAN</span>
      </div>
      <input class="tl" type="range" id="tl" min="0" max="1000" step="0.5" value="0" aria-label="Drag time from tonight back to the Big Bang">
      <div class="marks"><span>TONIGHT</span><span>−3,000 YR · ACCURACY WALL</span><span>−1 MYR</span><span>−1 BYR</span><span>−13.8 BYR · FIRST LIGHT</span></div>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var orr = $('orr'), reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var LOGMAX = Math.log10(13.8e9);
  var yearsBack = function (s) { return s <= 0 ? 0 : Math.pow(10, (s / 1000) * LOGMAX); };
  var fmtY = function (y) {
    if (y < 1) return 'TONIGHT';
    if (y < 10000) return '−' + Math.round(y).toLocaleString('en-GB') + ' YEARS';
    if (y < 1e6) return '−' + (y / 1000).toFixed(y < 1e5 ? 1 : 0) + ' THOUSAND YEARS';
    if (y < 1e9) return '−' + (y / 1e6).toFixed(y < 1e8 ? 1 : 0) + ' MILLION YEARS';
    return '−' + (y / 1e9).toFixed(2) + ' BILLION YEARS';
  };
  var dcv = $('deepCv'), dctx = dcv.getContext('2d'), mode = '';
  function sizeDeep() { dcv.width = dcv.clientWidth || innerWidth; dcv.height = dcv.clientHeight || innerHeight; }
  sizeDeep(); addEventListener('resize', function () { sizeDeep(); mode = ''; paintDeep(lastY); });
  function paintDeep(y) {
    var W = dcv.width, H = dcv.height;
    var want = y > 13.42e9 ? 'cmb' : 'proto';
    if (want === mode && want === 'cmb') return;
    mode = want;
    dctx.fillStyle = '#000'; dctx.fillRect(0, 0, W, H);
    if (want === 'cmb') {
      for (var i = 0; i < 2600; i++) {
        var x = Math.random() * W, yy = Math.random() * H, r = 8 + Math.random() * 42;
        var hot = Math.random() > 0.5;
        var g = dctx.createRadialGradient(x, yy, 0, x, yy, r);
        g.addColorStop(0, hot ? 'rgba(214,120,60,.10)' : 'rgba(60,110,200,.10)');
        g.addColorStop(1, 'rgba(0,0,0,0)');
        dctx.fillStyle = g; dctx.fillRect(x - r, yy - r, r * 2, r * 2);
      }
    } else {
      var frac = Math.min(1, (y - 1e6) / 13.8e9);
      var n = Math.round(700 * (1 - frac * 0.75));
      for (var k = 0; k < n; k++) {
        dctx.globalAlpha = 0.15 + Math.random() * 0.55;
        dctx.fillStyle = Math.random() > 0.6 ? '#cfe0ff' : '#f2e9de';
        var s2 = Math.random() * 1.8;
        dctx.fillRect(Math.random() * W, Math.random() * H, s2, s2);
      }
      dctx.globalAlpha = 1;
    }
  }
  var lastY = 0, nowMs = Date.now();
  function apply(s) {
    var y = yearsBack(s); lastY = y;
    var zone, r1, r2, r3;
    var fanOp = 0, orrOp = 1, deepOp = 0;
    if (y < 3000) {
      zone = ['COMPUTED', 'var(--good)'];
      var jd = 2440587.5 + nowMs / 86400000 - y * 365.25;
      if (orr.setJD) { if (y < 1) { orr.setLive && orr.setLive(); } else orr.setJD(jd); }
      var d = new Date((jd - 2440587.5) * 86400000);
      r1 = y < 1 ? 'TONIGHT · THE REAL SKY' : d.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' }).toUpperCase() + (d.getFullYear() < 1 ? ' (ASTRONOMICAL)' : '');
      r2 = 'EVERY POSITION COMPUTED · MEEUS/VSOP87-CLASS SERIES · ±ARCMINUTES';
      r3 = 'THIS IS THE SAME ENGINE THAT CASTS YOUR CHART.';
    } else if (y < 1e6) {
      zone = ['DEGRADING — UNCERTAINTY BAND', 'var(--warn)'];
      fanOp = 1;
      var hrs = Math.pow(y / 3000, 2) * 0.5;
      r1 = fmtY(y);
      r2 = 'PLANET POSITIONS STILL COMPUTE — BUT EARTH’S SPIN DRIFT (ΔT) FANS ECLIPSE TRACKS BY ~±' + (hrs < 48 ? hrs.toFixed(1) + ' HOURS' : Math.round(hrs / 24).toLocaleString('en-GB') + ' DAYS');
      r3 = 'THE ORANGE FAN IS THE HONEST ERROR BAR — IT IS PART OF THE ANSWER.';
      var jd2 = 2440587.5 + nowMs / 86400000 - y * 365.25;
      if (orr.setJD) orr.setJD(jd2);
    } else if (y < 13.42e9) {
      zone = ['MODELLED / UNSURE', 'rgba(233,237,242,.6)'];
      orrOp = Math.max(0, 1 - (y - 1e6) / 4e6); deepOp = 1 - orrOp * 0.6;
      r1 = fmtY(y);
      r2 = 'NO POSITIONS ARE COMPUTABLE HERE. THE SOLAR SYSTEM ITSELF FORMS AT −4.6 BYR.';
      r3 = 'WHAT YOU SEE IS STRUCTURE MODELLED FROM COSMOLOGY — NOT A CHART. WE SAY SO.';
      paintDeep(y);
    } else {
      zone = ['FIRST LIGHT · CMB', 'var(--acc)'];
      orrOp = 0; deepOp = 1;
      r1 = '−13.8 BILLION YEARS + 380,000 · RECOMBINATION';
      r2 = 'THE UNIVERSE TURNS TRANSPARENT — THE OLDEST LIGHT THERE IS.';
      r3 = 'TEXTURE SIMULATED ON YOUR DEVICE — THE REAL MAP IS PLANCK’S (ESA, 2018). NOTHING OLDER CAN BE SEEN.';
      paintDeep(y);
    }
    $('zoneBadge').textContent = zone[0];
    $('zoneBadge').style.color = zone[1];
    $('zoneBadge').style.borderColor = zone[1];
    $('r1').textContent = r1; $('r2').textContent = r2; $('r3').textContent = r3;
    orr.style.opacity = orrOp; $('deepLayer').style.opacity = deepOp;
    $('fan').style.opacity = fanOp;
    if (fanOp > 0) {
      var spread = Math.min(46, 2 + 44 * Math.log10(y / 3000) / Math.log10(1e6 / 3000));
      $('fanPath').setAttribute('d', 'M 50 55 L ' + (50 - spread) + ' 100 L ' + (50 + spread) + ' 100 Z');
    }
  }
  var tl = $('tl');
  tl.addEventListener('input', function () { stopPlay(); apply(+tl.value); });
  $('nowBtn').addEventListener('click', function () { stopPlay(); tl.value = 0; apply(0); });
  var playing = null;
  function stopPlay() { if (playing) { cancelAnimationFrame(playing); playing = null; $('playBtn').textContent = '▶ PLAY — 13.8 BILLION YEARS'; } }
  $('playBtn').addEventListener('click', function () {
    if (playing) { stopPlay(); return; }
    if (reduced) { tl.value = 1000; apply(1000); return; }
    $('playBtn').textContent = '■ STOP';
    var t0 = performance.now(), from = +tl.value, dur = 26000 * (1 - from / 1000);
    var step = function (now) {
      var u = Math.min(1, (now - t0) / dur);
      var v = from + (1000 - from) * u;
      tl.value = v; apply(v);
      if (u < 1) playing = requestAnimationFrame(step); else stopPlay();
    };
    playing = requestAnimationFrame(step);
  });
  function boot() { if (!window.VoidEphem) { setTimeout(boot, 150); return; } apply(0); }
  boot();
})();
</script>
</body>
</html>
