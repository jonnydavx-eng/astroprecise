<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Crossing lookdev</title>
<script type="importmap">{ "imports": { "three": "./js/vendor/three/three.module.min.js", "three/addons/": "./js/vendor/three/jsm/" } }</script>
<script src="js/ephemeris.js"></script>
<style>html,body{margin:0;background:#000;height:100%;overflow:hidden}canvas{width:100%;height:100%;display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
await import('./js/orrery-webgl.js?v=864');
window.Orrery3D.init(document.getElementById('c'), { showOrbits: false, showLabels: false });
await Promise.race([
  window.Orrery3D.whenReady(),
  new Promise((r) => setTimeout(r, 16000))
]);
if (window.Orrery3D.startIntro) window.Orrery3D.startIntro();
await new Promise((r) => setTimeout(r, 4200));
document.documentElement.dataset.ready = 'cross';
</script>
</body>
</html>
