<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Sky Explorer moved | AstroPrecise</title>
  <meta name="description" content="The old Sky Explorer URL now redirects to the Observatory. The 3D model runs on a sky clock — computed positions, not a live spacecraft feed.">
  <meta name="robots" content="noindex, follow">
  <script>
  (function () {
    var SAFE_FOCUS = {
      earth: 1, sun: 1, moon: 1, mercury: 1, venus: 1, mars: 1,
      jupiter: 1, saturn: 1, uranus: 1, neptune: 1, pluto: 1
    };
    var target = new URL('./index.html', location.href);
    var query = new URLSearchParams(location.search || '');
    var keptQuery = new URLSearchParams();
    query.forEach(function (value, key) {
      var canonicalKey = String(key || '').toLowerCase();
      if ((canonicalKey === 'nosw' || canonicalKey === 'lite') && String(value) === '1' && !keptQuery.has(canonicalKey)) {
        keptQuery.set(canonicalKey, '1');
      }
    });
    var fragment = new URLSearchParams(String(location.hash || '').replace(/^#/, ''));
    var keptHash = new URLSearchParams();
    fragment.forEach(function (value, key) {
      var canonicalKey = String(key || '').toLowerCase();
      if (canonicalKey === 'focus') {
        var focus = String(value || '').toLowerCase();
        if (SAFE_FOCUS[focus] && !keptHash.has('focus')) keptHash.set('focus', focus);
      }
      if (canonicalKey === 'scale' && /^-?\d+$/.test(String(value)) && !keptHash.has('scale')) {
        keptHash.set('scale', String(value));
      }
    });
    target.search = keptQuery.toString();
    target.hash = keptHash.toString();
    location.replace(target.href);
  })();
  </script>
  <link rel="stylesheet" href="./css/fonts.css?v=904">
  <link rel="canonical" href="https://astroprecise.app/">
  <noscript><meta http-equiv="refresh" content="0; url=./index.html"></noscript>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(circle at 50% 30%, rgba(139,169,255,.08), transparent 48%), #040812;
      color: #EEF4FA;
      font: 16px/1.6 'Schibsted Grotesk', 'Segoe UI', sans-serif;
    }
    main { width: min(560px, 100%); text-align: center; }
    h1 { margin: 0 0 16px; font: italic 500 clamp(42px, 9vw, 70px)/0.95 'Cormorant Garamond', Georgia, serif; }
    a {
      min-height: 46px;
      display: inline-flex;
      align-items: center;
      padding: 0 20px;
      border-radius: 5px;
      background: #8BA9FF;
      color: #07101E;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <h1>The Explorer is now the Observatory.</h1>
    <p>Planet focus, scale and sky-clock controls live on the Observatory route — computed on your device, honestly labelled.</p>
    <p><a href="./index.html">Open the Observatory</a></p>
  </main>
</body>
</html>
