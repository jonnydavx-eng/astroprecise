<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://geocoding-api.open-meteo.com https://api.open-meteo.com https://services.swpc.noaa.gov https://qrng.anu.edu.au https://api.gumroad.com; worker-src 'self'; manifest-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self' https://formspree.io">
  <meta name="robots" content="noindex, follow">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <script>
  (function () {
    var target = new URL('./compatibility.html', location.href);
    var incoming = new URLSearchParams(location.search || '');
    var query = new URLSearchParams();
    incoming.forEach(function (value, key) {
      var name = String(key || '').toLowerCase();
      if ((name === 'nosw' || name === 'lite') && String(value) === '1' && !query.has(name)) query.set(name, '1');
    });
    target.search = query.toString();
    target.hash = '';
    location.replace(target.href);
  })();
  </script>
  <meta name="theme-color" content="#040812">
  <title>AstroPrecise — two birth minutes, one sky</title>
  <meta name="description" content="Synastry lives in the one sky. Two birth minutes, one model.">

  </style>
