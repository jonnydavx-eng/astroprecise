<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <script>
  (function () {
    var target = new URL('./index.html', location.href);
    var incoming = new URLSearchParams(location.search || '');
    var query = new URLSearchParams();
    incoming.forEach(function (value, key) {
      var name = String(key || '').toLowerCase();
      if ((name === 'nosw' || name === 'lite') && String(value) === '1' && !query.has(name)) query.set(name, '1');
    });
    target.search = query.toString();
    target.hash = '';
    location.replace(target.href);
  })();
  </script>
  <title>My Sky moved | AstroPrecise</title>
  <meta name="description" content="The old My Sky hub now redirects to the Observatory and Chart routes.">
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://astroprecise.app/">
  <link rel="stylesheet" href="./css/fonts.css?v=942">
  <noscript><meta http-equiv="refresh" content="0; url=./index.html"></noscript>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: #F6F3EC; color: #0E1116; font-family: "AP Sans", Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { width: min(560px, 100%); padding: 34px; border: 1px solid #D6D1C6; border-radius: 2px; background: #FBF9F4; }
    p { margin: 0 0 20px; color: #3A3F47; font-size: 17px; line-height: 1.65; }
    a { min-height: 46px; display: inline-flex; align-items: center; padding: 0 20px; border-radius: 2px; background: #0E1116; color: #F6F3EC; font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <main><p>The old My Sky hub now points to the Observatory and Chart routes.</p><p><a href="./observatory.html">Observatory</a> · <a href="./chart.html">Chart</a></p></main>

</html>
