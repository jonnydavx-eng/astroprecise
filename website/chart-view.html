<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="refresh" content="0; url=chart.html" />
  <meta name="color-scheme" content="dark" />
  <title>Open your private chart — Astro Precise</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      color: #eee8dd;
      background:
        radial-gradient(circle at 50% 28%, rgba(72, 106, 145, .2), transparent 42%), #020307;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { width: min(36rem, 100%); text-align: center; }
    p { color: #aeb5c0; line-height: 1.65; }
    a {
      display: inline-flex;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      margin-top: .75rem;
      padding: .8rem 1.2rem;
      border: 1px solid rgba(238, 232, 221, .35);
      border-radius: 999px;
      color: #f3eee4;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>Opening your private chart</h1>
    <p>AstroPrecise no longer carries birth details in shared web addresses. Cast or reopen the chart privately on this device.</p>
    <a href="chart.html">Open the chart studio</a>
  </main>
  <script>
    try { history.replaceState(null, '', 'chart.html'); } catch (_) {}
    location.replace('chart.html');
  </script>
</body>
</html>
