name: Refresh content bank by pull request

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: refresh-content-bank
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'jonnydavx-eng/astroprecise' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    env:
      AUTOMATION_BRANCH: automation/content-bank-refresh
      BASE_BRANCH: main
    steps:
      - name: Check out the exact protected default-branch event
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse event identity drift and create the automation branch
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test "$EXPECTED_SHA" = "$(git rev-parse HEAD)" || {
            echo "Checked-out HEAD does not match the scheduled default-branch SHA."
            exit 1
          }
          git switch --force-create "$AUTOMATION_BRANCH" "$EXPECTED_SHA"

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install locked dependencies
        run: npm ci

      - name: Rebuild the engine-only rolling content bank
        run: node tools/build-content-bank.mjs --days 181 --months 12

      - name: Detect content-bank changes
        id: diff
        run: |
          if [ -n "$(git status --porcelain -- website/data/content-bank)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Content bank is unchanged; no branch or pull request update is needed."
          fi

      - name: Regenerate the service-worker precache
        if: steps.diff.outputs.changed == 'true'
        run: node website/tools/generate-sw-precache.mjs

      - name: Refuse changes outside the generated content-bank surface
        if: steps.diff.outputs.changed == 'true'
        run: |
          unexpected="$({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u | grep -Ev '^(website/data/content-bank/|website/sw\.js$)' || true)"
          if [ -n "$unexpected" ]; then
            echo "Generator changed paths outside website/data/content-bank and website/sw.js:"
            echo "$unexpected"
            exit 1
          fi

      - name: Run the complete non-browser regression contract
        if: steps.diff.outputs.changed == 'true'
        run: |
          npm run check:syntax
          npm test
          npm run test:launch
          npm run build
          git diff --check

      - name: Commit the generated result
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "astroprecise-bank-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/data/content-bank website/sw.js
          git commit -m "chore(content): refresh rolling content bank $(date -u +%F) [bot]"

      - name: Push only the dedicated automation branch
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          remote_sha="$(git ls-remote --heads origin "refs/heads/$AUTOMATION_BRANCH" | cut -f1)"
          git push --force-with-lease="refs/heads/$AUTOMATION_BRANCH:$remote_sha" origin "HEAD:refs/heads/$AUTOMATION_BRANCH"

      - name: Open or update the review pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr_number="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head "$AUTOMATION_BRANCH" --json number --jq '.[0].number')"
          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" --repo "$GITHUB_REPOSITORY" --base "$BASE_BRANCH" --title "chore(content): refresh rolling content bank" --body "Automated engine-only content-bank refresh. Review the generated diff and required checks before merge; this workflow never writes to the production branch."
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base "$BASE_BRANCH" --head "$AUTOMATION_BRANCH" --title "chore(content): refresh rolling content bank" --body "Automated engine-only content-bank refresh. Review the generated diff and required checks before merge; this workflow never writes to the production branch."
          fi
