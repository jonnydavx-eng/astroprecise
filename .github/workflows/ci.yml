name: Candidate quality gates

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: astroprecise-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out the exact event candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Refuse checkout identity drift
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$EXPECTED_SHA" = "$(git rev-parse HEAD)" || {
            echo "Checked-out HEAD does not match the event candidate SHA."
            exit 1
          }

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            tools/visual-check/package-lock.json

      - name: Install locked dependencies
        run: |
          npm ci
          npm --prefix tools/visual-check ci

      - name: Install Chromium for browser quality gates
        run: npx playwright install --with-deps chromium
        working-directory: tools/visual-check

      - name: Reject high-severity dependency findings
        run: |
          npm audit --audit-level=high
          npm --prefix tools/visual-check audit --audit-level=high

      - name: Run code and product contract gates
        run: |
          npm run check:syntax
          npm run lint
          npm run test:shop
          npm run test:fulfil
          npm run test:launch
          npm test
          node tools/test-product-render.mjs
          git diff --check

      - name: Run UI, accessibility, palette and profile gates
        run: |
          node website/tools/serve-preview.mjs 8790 > "$RUNNER_TEMP/astroprecise-preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8790/?nosw=1 > /dev/null; then
              break
            fi
            if ! kill -0 "$preview_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/astroprecise-preview.log"
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:8790/?nosw=1 > /dev/null
          npm run test:ui
          npm --prefix tools/visual-check run a11y
          npm run test:palette-rendered
          npm run test:profile-security

      - name: Refuse source mutation before build
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git ls-files --others --exclude-standard)"

      - name: Build the production artifact
        run: npm run build

      - name: Run production-artifact Lighthouse gates
        timeout-minutes: 20
        env:
          LH_CI_A11Y_MIN: 90
          LH_CI_PERF_MIN: 50
        run: |
          PORT=8790 node tools/serve-dist.mjs > "$RUNNER_TEMP/astroprecise-lighthouse.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8790/?nosw=1 > /dev/null; then
              break
            fi
            if ! kill -0 "$preview_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/astroprecise-lighthouse.log"
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:8790/?nosw=1 > /dev/null
          npm --prefix tools/visual-check run lighthouse:production:ci
