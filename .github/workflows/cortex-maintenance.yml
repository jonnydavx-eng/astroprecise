name: Cortex Maintenance

# Weekly autonomous repo-health sweep + always-on state validators.
# Two jobs:
#   checks  — dependency-free validators; run today, no secret needed.
#   agent   — the autonomous maintenance agent; activates when the repo secret
#             ANTHROPIC_API_KEY is present. Write-gated: opens issues/PRs only.
on:
  schedule:
    - cron: '17 8 * * 1'      # Mondays 08:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['cortex/state.js', 'cortex/**']

# Least privilege at the top; the agent job widens to contents:write for PRs.
permissions:
  contents: read

concurrency:
  group: cortex-maintenance
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Validate shared state
        run: node cortex/tools/validate-state.mjs
      - name: Cross-model verdict gate
        run: node cortex/tools/check-verdicts.mjs
      - name: Index freshness (fails if INDEX.md is stale)
        run: |
          node cortex/tools/build-index.mjs
          if ! git diff --quiet -- cortex/INDEX.md; then
            echo "::error::cortex/INDEX.md is stale — run: node cortex/tools/build-index.mjs"
            git --no-pager diff -- cortex/INDEX.md
            exit 1
          fi
      - name: Memory budget report (non-blocking)
        run: |
          echo "Memory file sizes (caps: per-agent Learnings ~60, shared ~120):"
          wc -l cortex/memory/*.md || true
      - name: MCP server smoke test
        run: node cortex/tools/mcp-smoke.mjs

  # Secrets can't be referenced in a job-level `if:` (GitHub limitation), so a
  # tiny gate job reads the secret into an output the `agent` job can test.
  gate:
    runs-on: ubuntu-latest
    outputs:
      has_key: ${{ steps.k.outputs.has_key }}
    steps:
      - id: k
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "ANTHROPIC_API_KEY not set — maintenance agent stays dormant (validators still ran)."
          fi

  agent:
    needs: [checks, gate]
    runs-on: ubuntu-latest
    # contents:write is required to push a branch for the mechanical-fix PRs this
    # job may open (e.g. a regenerated INDEX.md); pull-requests:write alone doesn't
    # cover the git push. issues:write for the findings issue.
    permissions:
      contents: write
      pull-requests: write
      issues: write
    # Activates only once the owner adds the ANTHROPIC_API_KEY repo secret.
    if: ${{ github.event_name != 'push' && needs.gate.outputs.has_key == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Autonomous maintenance sweep
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: >
            Run the Cortex maintenance sweep. Read cortex/skills/maintenance-sweep.md
            and follow it exactly. You are WRITE-GATED: your only outputs are a GitHub
            issue (findings) or a pull request (mechanical safe fixes like a regenerated
            cortex/INDEX.md). Never push to main. If everything is clean, open no issue.
            Always append a one-line entry to cortex/state.js activity noting the sweep,
            and include that in your PR if you open one.
          claude_args: '--allowedTools Read,Grep,Glob,Bash'
