name: Deploy verified release to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact lowercase 40-character commit SHA to release
        required: true
        type: string

# Each job receives only the permissions it needs. The release must be
# dispatched from a protected release/ap-vNNN-<12hex> tag whose commit matches
# candidate_sha; tools/verify-release-dispatch.mjs enforces that identity before
# any test, build, or deployment job is allowed to start.
permissions: {}

concurrency:
  group: astroprecise-pages-release
  cancel-in-progress: false

jobs:
  release_identity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      candidate_sha: ${{ steps.identity.outputs.candidate_sha }}
      release_tag: ${{ steps.identity.outputs.release_tag }}
      release_version: ${{ steps.identity.outputs.release_version }}
    steps:
      - name: Check out the selected release tag with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Verify immutable release identity
        id: identity
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: node tools/verify-release-dispatch.mjs

  test:
    needs: release_identity
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Check out the verified candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release_identity.outputs.candidate_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # Lighthouse 13 requires Node >=22.19. The maintained 22.x line keeps
          # CI compatible without jumping to a non-LTS runtime.
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            tools/visual-check/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install browser quality dependencies
        run: npm ci
        working-directory: tools/visual-check

      - name: Install Chromium for UI quality gates
        run: npx playwright install --with-deps chromium
        working-directory: tools/visual-check

      - name: Dependency audit gates
        run: |
          npm audit --audit-level=high
          npm --prefix tools/visual-check audit --audit-level=high

      # npm test is the canonical suite. New regression files become deploy
      # gates when they are added there instead of being silently omitted from
      # a second hardcoded CI list.
      - name: Canonical regression suite
        run: npm test

      - name: JavaScript syntax gate
        run: npm run check:syntax

      - name: Launch contract gate
        run: npm run test:launch

      - name: UI, accessibility and profile gates
        run: |
          node website/tools/serve-preview.mjs 8790 > preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8790/?nosw=1 > /dev/null; then
              break
            fi
            if ! kill -0 "$preview_pid" 2>/dev/null; then
              cat preview.log
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:8790/?nosw=1 > /dev/null
          npm run test:ui
          npm --prefix tools/visual-check run a11y
          npm run test:palette-rendered
          npm run test:profile-security
          node tools/e2e-profile-save-audit.mjs

      - name: Build production artifact for Lighthouse
        run: npm run build

      - name: Production artifact Lighthouse CI
        # Blocking catastrophe floor, not a claim that 50 is the product target.
        # Shared-runner performance is noisy, while a11y remains a firm 90 floor.
        timeout-minutes: 20
        env:
          LH_CI_A11Y_MIN: 90
          LH_CI_PERF_MIN: 50
        run: |
          PORT=8790 node tools/serve-dist.mjs > lighthouse-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8790/?nosw=1 > /dev/null; then
              break
            fi
            if ! kill -0 "$preview_pid" 2>/dev/null; then
              cat lighthouse-preview.log
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:8790/?nosw=1 > /dev/null
          npm --prefix tools/visual-check run lighthouse:production:ci

  build:
    needs: [release_identity, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Check out the verified candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release_identity.outputs.candidate_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.x'

      # Faithful minify-in-place (tools/build.mjs): same paths, smaller files.
      # dist/ is the deployable tree, including CNAME, .nojekyll, .well-known,
      # and the generated service-worker precache.
      - name: Build minified dist
        run: |
          npm ci
          npm run build

      # This file is generated only after the immutable dispatch gate and is
      # shipped inside the Pages artifact. Cloudflare verification binds the
      # public deployment to this exact commit instead of trusting ap-vNNN or
      # a header that the edge tool itself controls.
      - name: Stamp exact release identity into the Pages artifact
        env:
          CANDIDATE_SHA: ${{ needs.release_identity.outputs.candidate_sha }}
          RELEASE_TAG: ${{ needs.release_identity.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.release_identity.outputs.release_version }}
        run: >-
          node tools/verify-release-dispatch.mjs
          --write-artifact
          "dist/.well-known/astroprecise-release/$CANDIDATE_SHA.json"

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./dist

  deploy:
    needs: [release_identity, test, build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

  postdeploy:
    needs: [release_identity, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the deployed candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release_identity.outputs.candidate_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.x'

      - name: Verify public release identity
        env:
          CANDIDATE_SHA: ${{ needs.release_identity.outputs.candidate_sha }}
        run: |
          sleep 30
          node tools/setup-cloudflare-release-edge.mjs --verify-public --candidate "$CANDIDATE_SHA"

      - name: Notify search engines with IndexNow
        run: |
          node tools/ping-indexnow.mjs
