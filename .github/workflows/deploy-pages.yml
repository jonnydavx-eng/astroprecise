name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'ephemeris-package/**'
      - 'tools/**'
      - 'test-*.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

# 2026-07-04: migrated OFF the legacy gh-pages branch builder onto the official
# GitHub Actions Pages deployment (actions/deploy-pages). The legacy pipeline
# flaked repeatedly ("Page build failed.") at v566/v568/v574 and AGAIN at v590
# even after force_orphan, each needing a manual POST /pages/builds kick. The
# Actions artifact flow bypasses the legacy builder entirely — no gh-pages
# branch, no branch-history bloat. Repo Pages source set to build_type=workflow
# via API. Custom domain (astroprecise.app) + HTTPS persist at the Pages level;
# CNAME + .nojekyll ship inside dist/.
# Rollback: PATCH build_type=legacy, restore the peaceiris publish step +
# contents:write, point Pages source back at gh-pages.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Lighthouse 13 requires Node >=22.19. The maintained 22.x line keeps
          # CI compatible without jumping to a non-LTS runtime.
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            tools/visual-check/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install browser quality dependencies
        run: npm ci
        working-directory: tools/visual-check

      - name: Install Chromium for UI quality gates
        run: npx playwright install --with-deps chromium
        working-directory: tools/visual-check

      - name: Dependency audit gates
        run: |
          npm audit --audit-level=high
          npm --prefix tools/visual-check audit --audit-level=high

      # npm test is the canonical suite. New regression files become deploy
      # gates when they are added there instead of being silently omitted from
      # a second hardcoded CI list.
      - name: Canonical regression suite
        run: npm test

      - name: JavaScript syntax gate
        run: npm run check:syntax

      - name: Launch contract gate
        run: npm run test:launch

      - name: UI, accessibility and profile gates
        run: |
          node website/tools/serve-preview.mjs 8790 > preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8790/?nosw=1 > /dev/null; then
              break
            fi
            if ! kill -0 "$preview_pid" 2>/dev/null; then
              cat preview.log
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:8790/?nosw=1 > /dev/null
          npm run test:ui
          npm --prefix tools/visual-check run a11y
          npm run test:palette-rendered
          npm run test:profile-security
          node tools/e2e-profile-save-audit.mjs

      - name: Build production artifact for Lighthouse
        run: npm run build

      - name: Production artifact Lighthouse CI
        # Blocking catastrophe floor, not a claim that 50 is the product target.
        # Shared-runner performance is noisy, while a11y remains a firm 90 floor.
        timeout-minutes: 20
        env:
          LH_CI_A11Y_MIN: 90
          LH_CI_PERF_MIN: 50
        run: |
          PORT=8790 node tools/serve-dist.mjs > lighthouse-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8790/?nosw=1 > /dev/null; then
              break
            fi
            if ! kill -0 "$preview_pid" 2>/dev/null; then
              cat lighthouse-preview.log
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:8790/?nosw=1 > /dev/null
          npm --prefix tools/visual-check run lighthouse:production:ci

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      # Faithful minify-in-place (tools/build.mjs): same paths, -27% JS / -29% CSS.
      # build.mjs already skips tools/, the phone-* dev pages and all *.md — dist/
      # IS the deployable tree (CNAME, .nojekyll, .well-known, sw.js precache all
      # included).
      - name: Build minified dist/
        run: |
          npm ci
          npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  # Official GitHub Pages deployment — replaces the flaky legacy branch builder.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - uses: actions/checkout@v4
        if: success()

      - uses: actions/setup-node@v4
        if: success()
        with:
          node-version: '22.x'

      - name: Notify search engines (IndexNow)
        if: success()
        run: |
          sleep 30
          node tools/ping-indexnow.mjs
