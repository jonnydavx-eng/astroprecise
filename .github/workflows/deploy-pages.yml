name: Deploy verified release to Cloudflare Pages

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact lowercase 40-character commit SHA to release
        required: true
        type: string

# Each job receives only the permissions it needs. The release must be
# dispatched from a protected release/ap-vNNN-<12hex> tag whose commit matches
# candidate_sha; tools/verify-release-dispatch.mjs enforces that identity before
# any test, build, or deployment job is allowed to start.
permissions: {}

concurrency:
  group: astroprecise-cloudflare-pages-release
  cancel-in-progress: false

jobs:
  release_identity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      candidate_sha: ${{ steps.identity.outputs.candidate_sha }}
      release_tag: ${{ steps.identity.outputs.release_tag }}
      release_version: ${{ steps.identity.outputs.release_version }}
    steps:
      - name: Check out the selected release tag with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Verify immutable release identity
        id: identity
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: node tools/verify-release-dispatch.mjs

  test:
    needs: release_identity
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Check out the verified candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release_identity.outputs.candidate_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # Lighthouse 13 requires Node >=22.19. The maintained 22.x line keeps
          # CI compatible without jumping to a non-LTS runtime.
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            tools/visual-check/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install browser quality dependencies
        run: npm ci
        working-directory: tools/visual-check

      - name: Install Chromium for UI quality gates
        run: npx playwright install --with-deps chromium
        working-directory: tools/visual-check

      - name: Dependency audit gates
        run: |
          npm audit --audit-level=high
          npm --prefix tools/visual-check audit --audit-level=high

      # npm test is the canonical suite. New regression files become deploy
      # gates when they are added there instead of being silently omitted from
      # a second hardcoded CI list.
      - name: Canonical regression suite
        run: npm test

      - name: JavaScript syntax gate
        run: npm run check:syntax

      - name: Launch contract gate
        run: npm run test:launch

      - name: UI, accessibility and profile gates
        run: |
          node website/tools/serve-preview.mjs 8790 > preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8790/?nosw=1 > /dev/null; then
              break
            fi
            if ! kill -0 "$preview_pid" 2>/dev/null; then
              cat preview.log
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:8790/?nosw=1 > /dev/null
          npm run test:ui
          npm --prefix tools/visual-check run a11y
          npm run test:palette-rendered
          npm run test:profile-security
          node tools/e2e-profile-save-audit.mjs

      - name: Build production artifact for Lighthouse
        run: npm run build

      - name: Production artifact Lighthouse CI
        # Blocking catastrophe floor, not a claim that 50 is the product target.
        # Shared-runner performance is noisy, while a11y remains a firm 90 floor.
        timeout-minutes: 20
        env:
          LH_CI_A11Y_MIN: 90
          LH_CI_PERF_MIN: 50
        run: |
          PORT=8790 node tools/serve-dist.mjs > lighthouse-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8790/?nosw=1 > /dev/null; then
              break
            fi
            if ! kill -0 "$preview_pid" 2>/dev/null; then
              cat lighthouse-preview.log
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:8790/?nosw=1 > /dev/null
          npm --prefix tools/visual-check run lighthouse:production:ci

  deploy:
    needs: [release_identity, test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    environment:
      name: cloudflare-pages
      url: ${{ steps.cloudflare.outputs.deployment-url }}
    outputs:
      deployment_url: ${{ steps.cloudflare.outputs.deployment-url }}
    steps:
      - name: Check out the verified candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release_identity.outputs.candidate_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.x'

      # Faithful minify-in-place (tools/build.mjs): same paths, smaller files.
      # dist/ is the deployable tree, including CNAME, _headers, .well-known,
      # and the generated service-worker precache.
      - name: Build minified dist
        run: |
          npm ci
          npm run build

      # The stamp command validates the checked-out SHA and release version,
      # writes the SHA-named identity document, and replaces exactly one
      # candidate placeholder in dist/_headers. Direct website/ uploads retain
      # the placeholder and cannot pass post-deploy proof.
      - name: Stamp exact identity and response header into the artifact
        env:
          CANDIDATE_SHA: ${{ needs.release_identity.outputs.candidate_sha }}
          RELEASE_TAG: ${{ needs.release_identity.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.release_identity.outputs.release_version }}
        run: node tools/verify-release-dispatch.mjs --stamp-cloudflare-pages dist

      - name: Deploy exact artifact to Cloudflare Pages
        id: cloudflare
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.125.0'
          command: >-
            pages deploy dist
            --project-name=astroprecise
            --branch=main
            --commit-hash=${{ needs.release_identity.outputs.candidate_sha }}
            --commit-message=${{ needs.release_identity.outputs.release_tag }}
            --commit-dirty=false

      - name: Confirm Cloudflare classified the deployment as production
        env:
          PAGES_ENVIRONMENT: ${{ steps.cloudflare.outputs.pages-environment }}
        run: |
          if [ "$PAGES_ENVIRONMENT" != "production" ]; then
            echo "Cloudflare classified the deployment as '$PAGES_ENVIRONMENT'; refusing a preview deployment."
            exit 1
          fi

  postdeploy:
    needs: [release_identity, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the deployed candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release_identity.outputs.candidate_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.x'

      - name: Verify public release identity
        env:
          CANDIDATE_SHA: ${{ needs.release_identity.outputs.candidate_sha }}
          DEPLOYMENT_URL: ${{ needs.deploy.outputs.deployment_url }}
        run: |
          node tools/setup-cloudflare-release-edge.mjs --verify-url "$DEPLOYMENT_URL" --candidate "$CANDIDATE_SHA"
          node tools/setup-cloudflare-release-edge.mjs --verify-public --candidate "$CANDIDATE_SHA"

      - name: Notify search engines with IndexNow
        run: |
          node tools/ping-indexnow.mjs
