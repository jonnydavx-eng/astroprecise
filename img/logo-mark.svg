<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Astro Precise mark">
  <!-- v576 brand mark — large master. Same geometry as the inline masthead mark
       in index.html, plus master-size detail: fine 36-position graduation,
       faint crosshair, two-tone (engraved-facet) star arms. Keep the masthead
       inline SVG and this file's core geometry in sync. -->

  <!-- Outer measurement ring -->
  <circle cx="24" cy="24" r="21" fill="none" stroke="#C2A05E" stroke-width="1.1" opacity="0.95"/>

  <!-- Fine graduation, inset just off the ring (10° steps, cardinals carried by main ticks) -->
  <g stroke="#C2A05E" stroke-width="0.55" opacity="0.32">
    <line x1="24" y1="4.6" x2="24" y2="5.7" transform="rotate(10 24 24)"/>
    <line x1="24" y1="4.6" x2="24" y2="5.7" transform="rotate(20 24 24)"/>
    <line x1="24" y1="4.6" x2="24" y2="5.7" transform="rotate(30 24 24)"/>
    <line x1="24" y1="4.6" x2="24" y2="5.7" transform="rotate(40 24 24)"/>
    <line x1="24" y1="4.6" x2="24" y2="5.7" transform="rotate(50 24 24)"/>
    <line x1="24" y1="4.6" x2="24" y2="5.7" transform="rotate(60 24 24)"/>
    <line x1="24" y1="4.6" x2="24" y2="5.7" transform="rotate(70 24 24)"/>
    <line x1="24" y1="4.6" x2="24" y2="5.7" transform="rotate(80 24 24)"/>
    <line x1="24" y1="4.6" x2="24" y2="5.7" transform="rotate(100 24 24)"/>
    <line x1="24" y1="4.6" x2="24" y2="5.7" transform="rotate(110 24 24)"/>
    <line x1="24" y1="4.6" x2="24" y2="5.7" transform="rotate(120 24 24)"/>
    <line x1="24" y1="4.6" x2="24" y2="5.7" transform="rotate(130 24 24)"/>
    <line x1="24" y1="4.6" x2="24" y2="5.7" transform="rotate(140 24 24)"/>
    <line x1="24" y1="4.6" x2="24" y2="5.7" transform="rotate(150 24 24)"/>
    <line x1="24" y1="4.6" x2="24" y2="5.7" transform="rotate(160 24 24)"/>
    <line x1="24" y1="4.6" x2="24" y2="5.7" transform="rotate(170 24 24)"/>
    <line x1="24" y1="4.6" x2="24" y2="5.7" transform="rotate(190 24 24)"/>
    <line x1="24" y1="4.6" x2="24" y2="5.7" transform="rotate(200 24 24)"/>
    <line x1="24" y1="4.6" x2="24" y2="5.7" transform="rotate(210 24 24)"/>
    <line x1="24" y1="4.6" x2="24" y2="5.7" transform="rotate(220 24 24)"/>
    <line x1="24" y1="4.6" x2="24" y2="5.7" transform="rotate(230 24 24)"/>
    <line x1="24" y1="4.6" x2="24" y2="5.7" transform="rotate(240 24 24)"/>
    <line x1="24" y1="4.6" x2="24" y2="5.7" transform="rotate(250 24 24)"/>
    <line x1="24" y1="4.6" x2="24" y2="5.7" transform="rotate(260 24 24)"/>
    <line x1="24" y1="4.6" x2="24" y2="5.7" transform="rotate(280 24 24)"/>
    <line x1="24" y1="4.6" x2="24" y2="5.7" transform="rotate(290 24 24)"/>
    <line x1="24" y1="4.6" x2="24" y2="5.7" transform="rotate(300 24 24)"/>
    <line x1="24" y1="4.6" x2="24" y2="5.7" transform="rotate(310 24 24)"/>
    <line x1="24" y1="4.6" x2="24" y2="5.7" transform="rotate(320 24 24)"/>
    <line x1="24" y1="4.6" x2="24" y2="5.7" transform="rotate(330 24 24)"/>
    <line x1="24" y1="4.6" x2="24" y2="5.7" transform="rotate(340 24 24)"/>
    <line x1="24" y1="4.6" x2="24" y2="5.7" transform="rotate(350 24 24)"/>
  </g>

  <!-- Eight main degree ticks: 4 cardinal (long) + 4 intercardinal (short) -->
  <g stroke="#C2A05E" stroke-linecap="round">
    <line x1="24" y1="6.2" x2="24" y2="10.2" stroke-width="1.3"/>
    <line x1="24" y1="6.2" x2="24" y2="10.2" stroke-width="1.3" transform="rotate(90 24 24)"/>
    <line x1="24" y1="6.2" x2="24" y2="10.2" stroke-width="1.3" transform="rotate(180 24 24)"/>
    <line x1="24" y1="6.2" x2="24" y2="10.2" stroke-width="1.3" transform="rotate(270 24 24)"/>
    <line x1="24" y1="4.8" x2="24" y2="7.6" stroke-width="0.9" transform="rotate(45 24 24)"/>
    <line x1="24" y1="4.8" x2="24" y2="7.6" stroke-width="0.9" transform="rotate(135 24 24)"/>
    <line x1="24" y1="4.8" x2="24" y2="7.6" stroke-width="0.9" transform="rotate(225 24 24)"/>
    <line x1="24" y1="4.8" x2="24" y2="7.6" stroke-width="0.9" transform="rotate(315 24 24)"/>
  </g>

  <!-- Faint crosshair -->
  <g stroke="#ECE6D8" stroke-width="0.55" opacity="0.14">
    <line x1="24" y1="11" x2="24" y2="37"/>
    <line x1="11" y1="24" x2="37" y2="24"/>
  </g>

  <!-- Four brass diamonds straddling the ring at the cardinals -->
  <g fill="#CDAE6A">
    <path d="M24 1.5 L25.15 3 L24 4.5 L22.85 3 Z"/>
    <path d="M24 1.5 L25.15 3 L24 4.5 L22.85 3 Z" transform="rotate(90 24 24)"/>
    <path d="M24 1.5 L25.15 3 L24 4.5 L22.85 3 Z" transform="rotate(180 24 24)"/>
    <path d="M24 1.5 L25.15 3 L24 4.5 L22.85 3 Z" transform="rotate(270 24 24)"/>
  </g>

  <!-- Eight-point star: one symmetric path, 4 long cardinal arms + 4 short diagonal arms -->
  <path fill="#ECE6D8" d="M24 12.2 L25.84 19.57 L30.51 17.49 L28.43 22.16 L35.8 24 L28.43 25.84 L30.51 30.51 L25.84 28.43 L24 35.8 L22.16 28.43 L17.49 30.51 L19.57 25.84 L12.2 24 L19.57 22.16 L17.49 17.49 L22.16 19.57 Z"/>
  <!-- Two-tone: shaded clockwise facet of each arm (engraved look) -->
  <path fill="#101620" opacity="0.12" d="M24 12.2 L25.84 19.57 L24 24 Z M30.51 17.49 L28.43 22.16 L24 24 Z M35.8 24 L28.43 25.84 L24 24 Z M30.51 30.51 L25.84 28.43 L24 24 Z M24 35.8 L22.16 28.43 L24 24 Z M17.49 30.51 L19.57 25.84 L24 24 Z M12.2 24 L19.57 22.16 L24 24 Z M17.49 17.49 L22.16 19.57 L24 24 Z"/>

  <!-- Centre hub: ring + brass dot -->
  <circle cx="24" cy="24" r="3.6" fill="none" stroke="#C2A05E" stroke-width="0.9"/>
  <circle cx="24" cy="24" r="1.3" fill="#CDAE6A"/>
</svg>
